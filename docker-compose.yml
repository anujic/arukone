x-app: &app
  build: .
  image: arukone-dev
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  dev:
    <<: *app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"

  test:
    <<: *app
    command: npm test

  test-watch:
    <<: *app
    command: npm run test:watch

  build:
    <<: *app
    command: npm run build

  preview:
    <<: *app
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
    environment:
      - HTTPS=${HTTPS:-0}
    ports:
      - "4173:4173"

volumes:
  node_modules:
